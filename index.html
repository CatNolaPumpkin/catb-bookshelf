*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% -10%,var(--wall) 0%,var(--wall-2) 85%)}
#root{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:40px 64px;min-height:100vh}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1.02;margin:6px 0 8px;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;color:var(--brass)}
.counts{color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 30px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;font:600 14px var(--body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}
.tab .n{font-weight:500;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.tab:focus-visible,.btn:focus-visible,.book:focus-visible,.ghost:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--wall);font:600 14px var(--body);padding:10px 16px;border-radius:999px;cursor:pointer}
.btn.quiet{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:#b3412f;border-color:#b3412f}
.shelves{display:flex;flex-direction:column;gap:46px}
.shelf{position:relative;padding:0 18px}
.row{display:flex;align-items:flex-end;gap:var(--gap);min-height:calc(var(--bw)*1.5 + 6px);padding-inline:6px}
.plank{height:18px;margin-inline:-18px;border-radius:3px;
  background:linear-gradient(180deg,var(--wood-hi) 0,var(--wood) 30%,var(--wood-lo) 100%);
  box-shadow:0 14px 18px -10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.plank{position:relative}
.plank::after{content:"";position:absolute;left:4px;right:4px;top:100%;height:9px;background:radial-gradient(circle at 50% 0,var(--wood-lo) 0 6px,transparent 6.5px) 0 0/16px 9px repeat-x}
.book{position:relative;flex:0 0 var(--bw);width:var(--bw);aspect-ratio:2/3;max-width:100%;border:0;padding:0;background:none;cursor:pointer;
  transform-origin:50% 100%;transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s}
.book .face{position:absolute;inset:0;border-radius:2px 4px 4px 2px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,-6px 0 10px -6px rgba(0,0,0,.5) inset,3px 6px 10px rgba(0,0,0,.28)}
.book .face::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12) 60%,transparent);z-index:2}
.book img{width:100%;height:100%;object-fit:cover;display:block}
.book:hover,.book:focus-visible{transform:translateY(-12px) rotate(-2.5deg);filter:drop-shadow(0 14px 12px rgba(0,0,0,.25))}
.book .tag{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translate(-50%,4px);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;
  background:var(--panel);color:var(--panel-ink);font:600 12px var(--body);padding:5px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s}
.book:hover .tag,.book:focus-visible .tag{opacity:1;transform:translate(-50%,0)}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12% 11% 10%;text-align:left}
.gen .frame{position:absolute;inset:6%;border:1px solid currentColor;opacity:.35;border-radius:1px}
.gen .t{font-family:var(--display);font-weight:700;line-height:1.05;font-size:calc(var(--bw)*.15);text-wrap:balance;position:relative;overflow-wrap:anywhere}
.gen .a{font-size:calc(var(--bw)*.078);letter-spacing:.12em;text-transform:uppercase;font-weight:600;position:relative;opacity:.85}
.gen .rule{width:30%;height:2px;background:currentColor;opacity:.6;position:relative}
.ghost{flex:0 0 var(--bw);width:var(--bw);aspect-ratio:2/3;border:1.5px dashed var(--muted);border-radius:4px;background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ghost span{font-family:var(--display);font-size:30px;line-height:1}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.bookend{flex:0 0 auto;width:14px;height:calc(var(--bw)*.9);margin-left:auto;background:linear-gradient(90deg,var(--brass),color-mix(in srgb,var(--brass) 60%,#000));border-radius:3px 3px 0 0;opacity:.85}
.empty{align-self:center;color:var(--muted);font-family:var(--display);font-style:italic;font-size:18px;padding-block:20px}
footer.foot{margin-top:56px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
/* overlay */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;overflow-y:auto}
.card{background:var(--panel);color:var(--panel-ink);border-radius:10px;width:min(720px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.35);
  display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:28px;padding:28px;position:relative;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.card .cover{--bw:200px;width:100%;position:relative;aspect-ratio:2/3}
.card .cover .book{width:100%;cursor:default}
.card .cover .book:hover{transform:none;filter:none}
.close{position:absolute;top:10px;right:12px;background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:6px}
.card h2{font-family:var(--display);font-size:30px;line-height:1.08;margin:0 0 4px;text-wrap:balance}
.card .by{color:var(--muted);margin:0 0 16px}
.stars{color:var(--brass);letter-spacing:3px;font-size:18px}
.stars .off{opacity:.25}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:18px 0}
dl.meta dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px}
dl.meta dd{margin:0}
dl.meta small{display:block;color:var(--muted)}
blockquote{margin:18px 0 0;padding:14px 18px;border-left:3px solid var(--brass);background:var(--chip);font-family:var(--display);font-style:italic;font-size:20px;line-height:1.35}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
/* form */
form.edit{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
form.edit h2{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.f .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{font:15px var(--body);color:var(--panel-ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:26px;color:var(--brass);cursor:pointer;padding:0 2px;line-height:1}
.rate button.off{opacity:.25}
.coverpick{display:flex;gap:14px;align-items:center}
.coverpick .mini{--bw:64px;width:64px;flex:0 0 64px;aspect-ratio:2/3;position:relative}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.25)}
@media (max-width:560px){
  #root{padding-block:28px 48px}
  .card{grid-template-columns:1fr;padding:22px}
  .card .cover{width:150px;margin:0 auto}
  form.edit{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.book,.tag,.card{transition:none;animation:none}.book:hover,.book:focus-visible{transform:none}}


.dress{position:absolute;pointer-events:none;z-index:3;max-width:none}
body{overflow-x:hidden}
#root{overflow-x:clip}
.book:hover,.book:focus-visible{transform:translateY(-14px) rotate(-3deg) scale(1.03)}
/* garden scene */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene canvas{position:absolute;display:block;max-width:none}
.scene .garden,.scene .frame{left:0;top:0}
.gates{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 45%}
.leaf{transition:transform 4.4s cubic-bezier(.55,.05,.25,1)}
.leaf.l{transform-origin:0 50%}
.leaf.r{transform-origin:100% 50%}
html.gate-open .leaf.l{transform:rotateY(84deg)}
html.gate-open .leaf.r{transform:rotateY(-84deg)}
html.gate-intro #root{opacity:0;transform:translateY(18px)}
html.gate-intro.gate-open #root{opacity:1;transform:none;transition:opacity 1.8s ease 2.6s,transform 1.8s ease 2.6s}
.sign{background:color-mix(in srgb,var(--panel) 85%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:14px;padding:22px 24px 0;margin-bottom:26px;box-shadow:0 12px 30px rgba(0,0,0,.16);color:var(--panel-ink)}
.sign header.top{margin-bottom:16px}
.sign .tabs{margin:0 -24px;padding:0 16px;border-bottom:0;border-top:1px solid var(--line)}
.shelves{position:relative;margin-top:96px;background:radial-gradient(circle at 50% 50%,rgba(255,226,170,.07) 0 2px,transparent 3px) 0 0/30px 30px,radial-gradient(ellipse at 50% 0,rgba(255,214,140,.16),transparent 60%),linear-gradient(180deg,var(--back-1),var(--back-2));border:12px solid var(--wood);border-top-width:16px;border-radius:10px 10px 4px 4px;padding:62px 22px 30px;
  box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 0 50px rgba(0,0,0,.55),0 0 0 1px var(--wood-lo)}
.shelves .empty{color:var(--on-wood)}
.shelves .ghost{color:var(--on-wood);border-color:var(--on-wood);opacity:.85}
footer.foot{background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:12px 20px;border-radius:999px;color:var(--panel-ink);margin-top:28px}
@media (max-width:560px){.shelves{border-width:8px;border-top-width:12px;padding:56px 8px 22px}.sign{padding:18px 18px 0}.sign .tabs{margin:0 -18px;padding:0 10px}}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
.face img.ol{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;z-index:1}
.face img.ol.on{opacity:1}
.ban{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);z-index:3;background:#8B0000;color:#fff;font:700 9px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.45);white-space:nowrap;pointer-events:none}
.card .cover .ban{font-size:12px;padding:6px 10px}
.ban-inline{display:inline-block;background:#8B0000;color:#fff;border-radius:4px;padding:2px 8px;margin-left:8px;letter-spacing:.12em}
.tab.banf{display:inline-flex;align-items:center;gap:7px;margin-left:auto}
.tab.banf::before{content:"";width:9px;height:9px;border-radius:50%;background:#8B0000}
.tab.banf[aria-pressed="true"]{color:var(--ink);border-color:#8B0000}
.f label.chk{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--panel-ink);padding-top:8px;cursor:pointer}

  x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-s*.9,-s*.05,-s*.85,-s*.45);x.quadraticCurveTo(-s*.5,-s*.55,-s*.35,-s*.75);x.quadraticCurveTo(-s*.1,-s*1.15,0,-s*1.05);
  x.quadraticCurveTo(s*.1,-s*1.15,s*.35,-s*.75);x.quadraticCurveTo(s*.5,-s*.55,s*.85,-s*.45);x.quadraticCurveTo(s*.9,-s*.05,0,0);x.fill();
  x.strokeStyle=shade(col,.45,.45);x.lineWidth=Math.max(.3,s*.04);x.beginPath();x.moveTo(0,0);x.lineTo(0,-s*.9);x.moveTo(0,-s*.25);x.lineTo(-s*.55,-s*.45);x.moveTo(0,-s*.25);x.lineTo(s*.55,-s*.45);x.stroke();x.restore()}
function stem(x,x0,y0,x1,y1,w,col){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(x0,y0);x.quadraticCurveTo(x0+(x1-x0)*.2+w*2,(y0+y1)/2,x1,y1);x.stroke()}
function shadowOn(x,r){if(r>15){x.shadowColor='rgba(60,25,30,.28)';x.shadowBlur=r*.12;x.shadowOffsetY=r*.03}}
function shadowOff(x){x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0}

/* ---------- blooms ---------- */
function peony(x,R,r,c){
  shadowOn(x,r);
  var rings=[[12,1,.44,-.35],[11,.84,.42,-.25],[10,.68,.4,-.12]];
  rings.forEach(function(rg,ri){var off=R()*6;for(var j=0;j<rg[0];j++){x.save();x.rotate(off+j*Math.PI*2/rg[0]+(R()-.5)*.3);paintPetal(x,r*rg[1]*(.9+R()*.15),r*rg[2],c,R,.07,rg[3],.42+ri*.06);x.restore()}});
  shadowOff(x);var cg=x.createRadialGradient(0,0,1,0,0,r*.5);cg.addColorStop(0,shade(c,-.45,.55));cg.addColorStop(1,shade(c,-.3,0));x.fillStyle=cg;x.beginPath();x.arc(0,0,r*.5,0,7);x.fill();
  shadowOn(x,r*.6);for(var k=0;k<20;k++){x.save();var a=R()*6.3,d=R()*r*.18;x.translate(Math.cos(a)*d,Math.sin(a)*d-r*.04);x.rotate(R()*6.3);paintPetal(x,r*(.22+R()*.16),r*.2,shade(c,.25).replace(/rgb\((\d+),(\d+),(\d+)\)/,function(m,a1,b1,c1){return '#'+((1<<24)+(+a1<<16)+(+b1<<8)+ +c1).toString(16).slice(1)}),R,.12,-.2,.55);x.restore()}
  for(var f=0;f<4;f++){x.save();x.rotate(Math.PI+(f-1.5)*.42+(R()-.5)*.15);paintPetal(x,r*.62,r*.4,c,R,.06,-.1,.35);x.restore()}
  shadowOff(x)}

function gardenRose(x,R,r,c){
  shadowOn(x,r);
  for(var j=0;j<6;j++){x.save();x.rotate(j*1.047+R()*.3);paintPetal(x,r,r*.62,c,R,.04,-.35,.25);x.restore()}
  shadowOff(x);
  var cg=x.createRadialGradient(0,-r*.05,1,0,0,r*.66);cg.addColorStop(0,shade(c,.45));cg.addColorStop(.7,shade(c,.05));cg.addColorStop(1,shade(c,-.2));x.fillStyle=cg;x.beginPath();x.arc(0,0,r*.66,0,7);x.fill();
  /* quartered, swirled centre: crescent petal edges */
  for(var q=0;q<4;q++){var a=q*Math.PI/2+.4+R()*.2,cx=Math.cos(a)*r*.2,cy=Math.sin(a)*r*.2;
    for(var k=5;k>=1;k--){var rr=r*.08*k,s0=a+1.8+R()*.3;
      x.beginPath();x.arc(cx,cy,rr,s0,s0+2.5);x.arc(cx-Math.cos(a)*rr*.15,cy-Math.sin(a)*rr*.15,rr*.82,s0+2.5,s0,true);x.closePath();
      x.fillStyle=shade(c,.12+k*.05);x.fill();x.strokeStyle=shade(c,-.38,.7);x.lineWidth=Math.max(.4,r*.022);x.beginPath();x.arc(cx,cy,rr,s0,s0+2.5);x.stroke()}}
  x.fillStyle=shade(c,-.4);x.beginPath();x.arc(0,0,r*.05,0,7);x.fill();
  shadowOn(x,r*.7);for(var f=0;f<2;f++){x.save();x.rotate(Math.PI+(f?.45:-.45));paintPetal(x,r*.72,r*.55,c,R,.03,-.05,.3);x.restore()}shadowOff(x)}

function ranunculus(x,R,r,c){
  shadowOn(x,r);
  for(var k=0;k<12;k++){var rr=r*(1-k*.078),cy=-k*r*.018,n=10+(k%3);
    var g=x.createRadialGradient(0,cy-rr*.3,rr*.1,0,cy,rr);g.addColorStop(0,shade(c,.35-k*.01));g.addColorStop(.75,shade(c,k*.025));g.addColorStop(1,shade(c,-.28+k*.02));
    x.beginPath();for(var i=0;i<=n*6;i++){var a=i/(n*6)*Math.PI*2,w=rr*(1+.045*Math.cos(a*n+k));x.lineTo(Math.cos(a)*w,cy+Math.sin(a)*w*.92)}
    x.fillStyle=g;x.fill();if(k===0)shadowOff(x);
    x.strokeStyle=shade(c,.6,.6);x.lineWidth=Math.max(.3,r*.012);x.beginPath();for(var i2=0;i2<=n*6;i2++){var a2=Math.PI*.05+i2/(n*6)*Math.PI*.9,w2=rr*(1+.045*Math.cos(a2*n+k));x.lineTo(Math.cos(a2)*w2,cy+Math.sin(a2)*w2*.92)}x.stroke()}
  var bg=x.createRadialGradient(0,-r*.24,0,0,-r*.22,r*.1);bg.addColorStop(0,'#c9d98a');bg.addColorStop(1,'#6f8a3c');x.fillStyle=bg;x.beginPath();x.arc(0,-r*.22,r*.09,0,7);x.fill();shadowOff(x)}

function tulip(x,R,r,c,lc){
  stem(x,0,r*2.6,0,0,Math.max(1,r*.09),lc);leaf(x,0,r*2.5,r*2,-.3+R()*.2,lc);
  shadowOn(x,r);
  function p(sx,w,h,dk){x.save();x.translate(sx,r*.35);var g=x.createLinearGradient(-w,0,w,0);g.addColorStop(0,shade(c,-.35+dk));g.addColorStop(.45,shade(c,.12+dk));g.addColorStop(.6,shade(c,.32+dk));g.addColorStop(1,shade(c,-.25+dk));
    x.fillStyle=g;x.beginPath();x.moveTo(0,0);x.bezierCurveTo(-w*1.15,-h*.2,-w*.9,-h*.85,0,-h);x.bezierCurveTo(w*.9,-h*.85,w*1.15,-h*.2,0,0);x.fill();x.restore()}
  p(-r*.18,r*.38,r*1.35,-.12);p(r*.18,r*.38,r*1.35,-.12);p(0,r*.42,r*1.45,0);shadowOff(x)}

function floret(x,px,py,s,col){x.save();x.translate(px,py);for(var i=0;i<6;i++){x.rotate(1.047);x.fillStyle=i%2?shade(col,.15):shade(col,-.08);petalPath(x,s,s*.42);x.fill()}
  x.fillStyle=shade(col,.6);x.beginPath();x.arc(0,0,s*.22,0,7);x.fill();x.restore()}
function hyacinth(x,R,r,c,lc){
  stem(x,0,r*2.6,0,-r*.4,Math.max(1,r*.1),lc);leaf(x,-r*.1,r*2.5,r*1.7,-.25,lc);leaf(x,r*.1,r*2.5,r*1.6,.3,lc);
  for(var i=0;i<40;i++){var t=i/40,w=r*.55*(1-t*.6);floret(x,(R()-.5)*2*w,r*.4-t*r*2.3+(R()-.5)*r*.1,r*.24*(1-t*.3),shade(c,(R()-.6)*.25).replace(/rgb\((\d+),(\d+),(\d+)\)/,function(m,a1,b1,c1){return '#'+((1<<24)+(+a1<<16)+(+b1<<8)+ +c1).toString(16).slice(1)}))}}

function allium(x,R,r,c,lc){
  stem(x,0,r*3.4,R()*r*.4-r*.2,0,Math.max(1,r*.06),lc);

  for(var i=0;i<90;i++){var a=R()*6.28,d=Math.sqrt(R())*r*.8,lx=Math.cos(a)*d,ly=Math.sin(a)*d,lit=(-lx-ly)/r*.35;
    x.fillStyle=shade(c,lit);x.save();x.translate(lx,ly);for(var s=0;s<6;s++){x.rotate(1.047);x.fillRect(-r*.012,0,r*.024,r*.09)}x.restore()}}

function foxglove(x,R,r,c,lc){

  for(var i=0;i<10;i++){var t=i/10,py=r*1.6-t*r*3,s=r*.44*(1-t*.6),side=i%2?1:-1;
    x.save();x.translate(side*s*.45,py);x.rotate(side*.45);

    x.beginPath();x.moveTo(-s*.35,-s*.6);x.bezierCurveTo(-s*.6,0,-s*.55,s*.6,-s*.45,s*.75);x.lineTo(s*.45,s*.75);x.bezierCurveTo(s*.55,s*.6,s*.6,0,s*.35,-s*.6);x.closePath();x.fill();
    x.fillStyle=shade(c,.65);x.beginPath();x.ellipse(0,s*.66,s*.4,s*.18,0,0,7);x.fill();
    x.fillStyle=shade(c,-.5);for(var k=0;k<5;k++){x.beginPath();x.arc((R()-.5)*s*.45,s*.6+R()*s*.12,s*.04,0,7);x.fill()}x.restore()}}

function fritillaria(x,R,r,c,lc){
  x.strokeStyle=lc;x.lineWidth=Math.max(1,r*.06);x.beginPath();x.moveTo(0,r*2.6);x.quadraticCurveTo(r*.1,-r*.3,r*.55,-r*.2);x.stroke();
  x.save();x.translate(r*.6,-r*.15);x.rotate(.15);
  x.beginPath();x.moveTo(-r*.08,0);x.bezierCurveTo(-r*.55,r*.1,-r*.5,r*.95,-r*.3,r*1.05);x.lineTo(r*.3,r*1.05);x.bezierCurveTo(r*.5,r*.95,r*.55,r*.1,r*.08,0);x.closePath();
  x.save();x.clip();var s=r*.12;for(var gx=-r;gx<r;gx+=s)for(var gy=0;gy<r*1.1;gy+=s){x.fillStyle=(Math.round(gx/s)+Math.round(gy/s))%2?shade(c,.5):c;x.fillRect(gx,gy,s+.5,s+.5)}
  var sh=x.createLinearGradient(-r*.5,0,r*.5,0);sh.addColorStop(0,'rgba(0,0,0,.35)');sh.addColorStop(.45,'rgba(255,255,255,.18)');sh.addColorStop(1,'rgba(0,0,0,.3)');x.fillStyle=sh;x.fillRect(-r,0,r*2,r*1.2);x.restore();x.restore()}

function anemone(x,R,r,c){
  shadowOn(x,r);for(var j=0;j<6;j++){x.save();x.rotate(j*1.047+R()*.2);paintPetal(x,r,r*.82,c,R,.03,-.12,.25);x.restore()}shadowOff(x);
  var g=x.createRadialGradient(-r*.08,-r*.08,1,0,0,r*.3);g.addColorStop(0,'#3d4a6b');g.addColorStop(1,'#120e1f');x.fillStyle=g;x.beginPath();x.arc(0,0,r*.3,0,7);x.fill();
  for(var i=0;i<34;i++){var a=i/34*6.28,d=r*(.34+R()*.08);x.strokeStyle='#1d1630';x.lineWidth=Math.max(.4,r*.02);x.beginPath();x.moveTo(Math.cos(a)*r*.28,Math.sin(a)*r*.28);x.lineTo(Math.cos(a)*d,Math.sin(a)*d);x.stroke();x.fillStyle='#2b2140';x.beginPath();x.arc(Math.cos(a)*d,Math.sin(a)*d,r*.035,0,7);x.fill()}}

function scabiosa(x,R,r,c){
  shadowOn(x,r);for(var j=0;j<14;j++){x.save();x.rotate(j*.449);paintPetal(x,r,r*.36,c,R,.12,-.15,.3);x.restore()}shadowOff(x);
  var g=x.createRadialGradient(-r*.1,-r*.12,1,0,0,r*.42);g.addColorStop(0,shade(c,.3));g.addColorStop(1,shade(c,-.35));x.fillStyle=g;x.beginPath();x.arc(0,0,r*.42,0,7);x.fill();
  for(var k=0;k<46;k++){var a2=R()*6.28,d=Math.sqrt(R())*r*.4;x.fillStyle=k%3?'#f6f2fb':'#cfc0ea';x.beginPath();x.arc(Math.cos(a2)*d,Math.sin(a2)*d,r*.035,0,7);x.fill()}}

function passionflower(x,R,r,c){
  shadowOn(x,r);for(var j=0;j<10;j++){x.save();x.rotate(j*.628);paintPetal(x,r,r*.34,j%2?'#f3eff9':'#e5edd8',R,.02,-.12,.2);x.restore()}shadowOff(x);
  for(var i=0;i<72;i++){var a=i/72*6.28,ca=Math.cos(a),sa=Math.sin(a),wv=1+.07*Math.sin(i*3);x.lineWidth=Math.max(.45,r*.022);
    var seg=[[.12,.3,'#4a2a6b'],[.3,.42,'#ffffff'],[.42,.8,c]];
    for(var s=0;s<3;s++){x.strokeStyle=seg[s][2];x.beginPath();x.moveTo(ca*r*seg[s][0]*wv,sa*r*seg[s][0]*wv);x.lineTo(ca*r*seg[s][1]*wv,sa*r*seg[s][1]*wv);x.stroke()}}
  x.fillStyle='#8fb35c';x.beginPath();x.arc(0,0,r*.13,0,7);x.fill();
  for(var k=0;k<5;k++){x.save();x.rotate(k*1.257);x.fillStyle='#e8c84a';x.beginPath();x.ellipse(0,-r*.22,r*.05,r*.1,0,0,7);x.fill();x.restore()}
  for(var m=0;m<3;m++){x.save();x.rotate(m*2.09+.5);x.strokeStyle='#6b3a7a';x.lineWidth=Math.max(.6,r*.03);x.beginPath();x.moveTo(0,0);x.lineTo(0,-r*.17);x.stroke();x.fillStyle='#6b3a7a';x.beginPath();x.arc(0,-r*.18,r*.035,0,7);x.fill();x.restore()}}

function blossom(x,R,r,c){for(var i=0;i<5;i++){x.save();x.rotate(i*1.257);x.fillStyle=i%2?shade(c,.2):c;petalPath(x,r,r*.7);x.fill();x.restore()}x.fillStyle='#f6d47a';x.beginPath();x.arc(0,0,r*.2,0,7);x.fill()}

var PAL={peony:['#f4a7b9','#e8799a','#f7c6d0','#f9dbe2','#d9577a','#f29a8c'],
  rose:['#f2b8a2','#e9a0b5','#fbe8dc','#c8446b','#f5c9a8','#e7b9d6'],
  ranunculus:['#f6a16b','#f3c48e','#e85d75','#fbd3c3','#f4d47c','#c94f7c','#f7e7ef'],
  tulip:['#e8475f','#f7d046','#9b3f8f','#f49ac1','#fbf6ee','#f26b38'],
  hyacinth:['#7b6cd9','#a58be0','#f2a6c8','#f6f3ff','#5a7be0'],
  allium:['#9b6fd6','#b48be8'],foxglove:['#d46aa8','#e79ac8','#f2e6f4'],fritillaria:['#7a3a6e','#5d2b55'],
  anemone:['#fbfaf7','#d8445c','#6c5bd1'],scabiosa:['#b9a6e8','#9fb2ee'],passion:['#5b4bb3','#7a5cc7'],blossom:['#f7c3d4','#f4a9c0','#fbe0ea']};
var LOW={peony:peony,rose:gardenRose,ranunculus:ranunculus,anemone:anemone,scabiosa:scabiosa,passion:passionflower,blossom:blossom};
var TALL={tulip:tulip,hyacinth:hyacinth,allium:allium,foxglove:foxglove,fritillaria:fritillaria};

function flower(x,R,type,px,py,r,lc){x.save();x.translate(px,py);
  if(TALL[type])TALL[type](x,R,r,pick(R,PAL[type]),lc);
  else{x.rotate((R()-.5)*.5);x.scale(1,.8+R()*.18);LOW[type](x,R,r,pick(R,PAL[type]))}
  x.restore()}

/* ---------- Heartware logo: a heart wired with circuit traces ---------- */
function circuitHeart(x,s,side,col,lw){
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';
  [-1,1].forEach(function(d){if(side&&side!==d)return;
    x.beginPath();x.moveTo(0,.7*s);x.bezierCurveTo(d*.35*s,.4*s,d*.85*s,.1*s,d*.8*s,-.3*s);x.bezierCurveTo(d*.75*s,-.72*s,d*.2*s,-.75*s,0,-.38*s);x.stroke();
    var T=[[[d*.14,-.02],[d*.24,-.02],[d*.4,-.18],[d*.4,-.42]],[[d*.14,.08],[d*.52,.08],[d*.62,-.02]],[[d*.14,.18],[d*.24,.18],[d*.34,.28]],[[d*.06,-.12],[d*.06,-.24],[d*.18,-.36]]];
    x.lineWidth=lw*.7;T.forEach(function(t){x.beginPath();x.moveTo(t[0][0]*s,t[0][1]*s);for(var i=1;i<t.length;i++)x.lineTo(t[i][0]*s,t[i][1]*s);x.stroke();
      var e=t[t.length-1];x.beginPath();x.arc(e[0]*s,e[1]*s,s*.055,0,7);x.stroke();x.beginPath();x.arc(e[0]*s,e[1]*s,s*.02,0,7);x.fill()});
    x.lineWidth=lw*.8;x.strokeRect(d>0?0:-.14*s,-.1*s,.14*s,.36*s)});
  x.lineWidth=lw}

/* ---------- the garden ---------- */
function layer(W,H){var c=document.createElement('canvas');return setup(c,W,H)}
function flush(dst,src,b){var d=Math.min(window.devicePixelRatio||1,2);dst.save();dst.setTransform(1,0,0,1,0,0);dst.filter='blur('+(b*d)+'px)';dst.drawImage(src.canvas,0,0);dst.restore()}
function drawGarden(W,H){
  var x=setup(cG,W,H),R=rng(1979),k=Math.max(.55,Math.min(1.35,Math.min(W,H)/820));
  var g=x.createLinearGradient(0,0,0,H*.62);g.addColorStop(0,tok('--sky-top'));g.addColorStop(1,tok('--sky-bot'));x.fillStyle=g;x.fillRect(0,0,W,H);
  var hor=H*.56;
  var sun=x.createRadialGradient(W/2,hor-H*.08,4,W/2,hor-H*.08,Math.max(W,H)*.55);sun.addColorStop(0,tok('--glow'));sun.addColorStop(.25,tok('--glow-2'));sun.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sun;x.fillRect(0,0,W,H);
  function canopy(y,amp,col,step){x.save();x.fillStyle=col;for(var px=-step;px<=W+step;px+=step*.55){var rr=step*(.55+R()*.6);x.beginPath();x.arc(px,y-amp*R(),rr,0,7);x.fill()}x.fillRect(0,y,W,H-y);x.restore()}
  var main=x;x=layer(W,H);
  canopy(hor-40*k,90*k,tok('--far'),60*k);
  for(var t=0;t<6;t++){var tx=W*(.08+t*.17)+(R()-.5)*40,th=(120+R()*90)*k;x.save();x.fillStyle=tok('--far-2');x.beginPath();x.ellipse(tx,hor-th*.42,th*.12,th*.55,0,0,7);x.fill();x.restore()}
  /* cottage glimpsed between trees */
  x.save();var cx0=W*.5+60*k,cy0=hor-30*k;x.fillStyle=tok('--cottage');x.fillRect(cx0-40*k,cy0-30*k,80*k,40*k);x.fillStyle=tok('--roof');x.beginPath();x.moveTo(cx0-50*k,cy0-28*k);x.lineTo(cx0,cy0-66*k);x.lineTo(cx0+50*k,cy0-28*k);x.fill();
  x.fillStyle=tok('--window');x.fillRect(cx0-22*k,cy0-18*k,12*k,12*k);x.fillRect(cx0+10*k,cy0-18*k,12*k,12*k);x.restore();
  canopy(hor+6*k,46*k,tok('--mid'),38*k);
  flush(main,x,2.2);x=main;
  /* light shafts */
  if(tok('--rays')==='1'){x.save();x.globalCompositeOperation='screen';for(var s=0;s<6;s++){var a=-.9+s*.35+(R()-.5)*.1,len=H*1.1;var rg=x.createLinearGradient(W/2,hor-H*.1,W/2+Math.sin(a)*len,hor-H*.1+Math.cos(a)*len);rg.addColorStop(0,'rgba(255,225,160,.22)');rg.addColorStop(1,'rgba(255,225,160,0)');x.fillStyle=rg;x.beginPath();x.moveTo(W/2,hor-H*.1);x.lineTo(W/2+Math.sin(a-.05)*len,hor-H*.1+Math.cos(a-.05)*len);x.lineTo(W/2+Math.sin(a+.05)*len,hor-H*.1+Math.cos(a+.05)*len);x.fill()}x.restore()}
  /* flagstone path */
  var top=hor+14*k;function half(y){return W*.025+W*.24*(y-top)/(H-top)}
  x.fillStyle=tok('--path');x.beginPath();x.moveTo(W/2-half(top),top);x.lineTo(W/2+half(top),top);x.lineTo(W/2+half(H),H);x.lineTo(W/2-half(H),H);x.closePath();x.fill();
  for(var row=0;row<16;row++){var y0=top+Math.pow(row/16,1.7)*(H-top),y1=top+Math.pow((row+1)/16,1.7)*(H-top),hw=half(y0),n=2+Math.floor(row/4);
    for(var c=0;c<n;c++){var xa=W/2-hw+(2*hw)*c/n,xb=W/2-hw+(2*hw)*(c+1)/n,gp=Math.max(1,(y1-y0)*.08);x.fillStyle=shade(tok('--path'),(R()-.5)*.12);x.beginPath();x.ellipse((xa+xb)/2,(y0+y1)/2,(xb-xa)/2-gp,(y1-y0)/2-gp,0,0,7);x.fill()}}
  /* flower beds, back to front with depth of field */
  var rows=10,lc=tok('--stem'),lf=tok('--leaf');
  for(var i=0;i<rows;i++){var p=i/(rows-1),y=hor+18*k+Math.pow(p,1.3)*(H-hor+20*k),r=(6+p*30)*k,step=r*2.3;
    var blurN=p<.25?1.4:p<.45?.6:0,mainR=x;if(blurN)x=layer(W,H);x.save();
    var hp=half(Math.max(top,y))+r*.2;
    for(var fx=-step;fx<W+step;fx+=step*.32){if(Math.abs(fx-W/2)<hp)continue;leaf(x,fx+(R()-.5)*step*.4,y+r*.9,r*(1+R()*.7),(R()-.5)*2.4,shade(lf,(R()-.5)*.35-.1+p*.08))}
    for(var fx2=-step*.5;fx2<W+step;fx2+=step*(.75+R()*.35)){if(Math.abs(fx2-W/2)<hp+r*.5)continue;
      var type=pick(R,MIX),rr=r*(TALL[type]?.7:1)*(.85+R()*.3);flower(x,R,type,fx2+(R()-.5)*r*.6,y-(TALL[type]?r*1.3:0)+(R()-.5)*r*.3,rr,lc)}
    x.restore();if(blurN){flush(mainR,x,blurN);x=mainR}
    if(i===2){var hz=x.createLinearGradient(0,hor-60*k,0,hor+80*k);hz.addColorStop(0,'rgba(0,0,0,0)');hz.addColorStop(.5,tok('--haze'));hz.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=hz;x.fillRect(0,hor-60*k,W,140*k)}}
  x.fillStyle=tok('--wash');x.fillRect(0,0,W,H);
  if(tok('--fireflies')==='1'){for(var f=0;f<50;f++){var fx3=R()*W,fy=H*.3+R()*H*.65,fr=1.2+R()*2.2;var fg=x.createRadialGradient(fx3,fy,0,fx3,fy,fr*6);fg.addColorStop(0,'rgba(255,236,150,.9)');fg.addColorStop(1,'rgba(255,236,150,0)');x.fillStyle=fg;x.beginPath();x.arc(fx3,fy,fr*6,0,7);x.fill()}}
}

/* ---------- gilded ironwork ---------- */
function gold(x,x0,y0,x1,y1){var g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#7a5a17');g.addColorStop(.22,'#e9c46a');g.addColorStop(.38,'#fff0b3');g.addColorStop(.55,'#b8892c');g.addColorStop(.78,'#f1d27c');g.addColorStop(1,'#80601c');return g}
function ironStyle(x,w,lw){x.strokeStyle=gold(x,0,0,w,w*.6);x.fillStyle=x.strokeStyle;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.shadowColor='rgba(40,25,5,.45)';x.shadowBlur=4;x.shadowOffsetX=1.5;x.shadowOffsetY=2}
function scroll(x,cx,cy,s,dir){x.beginPath();for(var i=0;i<=40;i++){var t=i/40,a=t*Math.PI*2.4,rr=s*(1-t*.82);x.lineTo(cx+dir*Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.stroke()}
function spear(x,px,py,s){x.beginPath();x.moveTo(px,py-s*2.2);x.lineTo(px+s*.75,py-s*.6);x.lineTo(px,py-s*.9);x.lineTo(px-s*.75,py-s*.6);x.closePath();x.fill();x.beginPath();x.arc(px,py-s*.15,s*.45,0,7);x.fill()}

function drawLeaf(c,w,h,arch,mirror){
  var x=setup(c,w,h);if(mirror){x.translate(w,0);x.scale(-1,1)}
  var lw=Math.max(2.5,w*.012);ironStyle(x,w,lw);
  function top(px){return arch*(1-Math.sin(Math.PI/2*px/w))+lw*6}
  var bot=h-6,rail1=h*.58,rail2=h-Math.max(70,h*.12),rail3=bot-10;
  x.lineWidth=lw*2.2;x.beginPath();x.moveTo(lw,top(0));x.lineTo(lw,bot);x.moveTo(w-lw,top(w)+lw);x.lineTo(w-lw,bot);x.stroke();
  x.lineWidth=lw*1.6;x.beginPath();for(var px=0;px<=w;px+=4)x.lineTo(px,top(px)+lw*4);x.stroke();
  x.beginPath();for(var px2=0;px2<=w;px2+=4)x.lineTo(px2,top(px2)+lw*14);x.stroke();
  [rail1,rail2,rail3].forEach(function(y){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()});
  var n=Math.max(6,Math.round(w/34)),gap=w/n;x.lineWidth=lw;
  for(var i=1;i<n;i++){var bx=i*gap;x.beginPath();x.moveTo(bx,top(bx));x.lineTo(bx,rail3);x.stroke();spear(x,bx,top(bx),lw*2.2)}
  x.lineWidth=lw*.8;for(var j=0;j<n;j++){var sx=(j+.5)*gap,sy=top(sx)+lw*9;scroll(x,sx-gap*.12,sy,gap*.22,1);scroll(x,sx+gap*.12,sy,gap*.22,-1)}
  var ry=(rail2+rail3)/2,rr=Math.min(gap*.36,(rail3-rail2)*.36);for(var m=0;m<n;m++){x.beginPath();x.arc((m+.5)*gap,ry,rr,0,7);x.stroke()}
  for(var q=0;q<n;q++){var qx=(q+.5)*gap;scroll(x,qx,rail1-gap*.45,gap*.3,q%2?1:-1)}
  /* half of the Heartware medallion sits on each leaf; closed, they form the full logo */
  var my=h*.4,mr=Math.min(w*.24,h*.13);
  x.save();x.shadowColor='transparent';x.fillStyle='rgba(20,14,4,.35)';x.beginPath();x.arc(w,my,mr*.86,Math.PI/2,Math.PI*1.5);x.fill();x.restore();
  x.lineWidth=lw*1.6;x.beginPath();x.arc(w,my,mr,Math.PI/2,Math.PI*1.5);x.stroke();
  x.lineWidth=lw*.8;x.beginPath();x.arc(w,my,mr*.86,Math.PI/2,Math.PI*1.5);x.stroke();
  for(var b=0;b<9;b++){var ba=Math.PI/2+b*Math.PI/8;x.beginPath();x.arc(w+Math.cos(ba)*mr*1.12,my+Math.sin(ba)*mr*1.12,lw*.8,0,7);x.fill()}
  x.save();x.translate(w,my-mr*.04);circuitHeart(x,mr*.68,-1,x.strokeStyle,lw*1.1);x.restore()}

function stonePost(x,x0,x1,y0,H,R){
  var g=x.createLinearGradient(x0,0,x1,0);g.addColorStop(0,shade(tok('--post-1'),-.15));g.addColorStop(.5,tok('--post-2'));g.addColorStop(1,shade(tok('--post-1'),-.2));x.fillStyle=g;x.fillRect(x0,y0,x1-x0,H-y0);
  var bh=Math.max(14,(x1-x0)*.55),row=0;for(var y=y0;y<H;y+=bh,row++){var off=row%2?(x1-x0)*.5:0;
    for(var bx=x0-off;bx<x1;bx+=(x1-x0)){x.fillStyle=shade(tok('--post-1'),(R()-.5)*.14,.55);x.fillRect(Math.max(x0,bx)+1,y+1,Math.min(x1,bx+(x1-x0))-Math.max(x0,bx)-2,bh-2)}
    x.fillStyle='rgba(60,45,30,.25)';x.fillRect(x0,y,x1-x0,1.2)}
  for(var d=0;d<(x1-x0)*(H-y0)/90;d++){x.fillStyle='rgba(70,60,40,'+(R()*.18)+')';x.fillRect(x0+R()*(x1-x0),y0+R()*(H-y0),1.2,1.2)}}

function drawFrame(W,H,gx,gt){
  var x=setup(cF,W,H),R=rng(77),k=Math.max(.55,Math.min(1.3,Math.min(W,H)/820)),lw=Math.max(3,W*.004);
  var pw=gx;[[0,pw],[W-pw,W]].forEach(function(p){stonePost(x,p[0],p[1],gt-20*k,H,R);
    ironStyle(x,W,lw);x.fillRect(p[0]-4,gt-26*k,p[1]-p[0]+8,9*k);x.beginPath();x.arc((p[0]+p[1])/2,gt-40*k,12*k,0,7);x.fill();spear(x,(p[0]+p[1])/2,gt-52*k,8*k);x.shadowColor='transparent'});
  ironStyle(x,W,lw*1.2);var ay=gt-26*k,ah=Math.min(gt*.42,W*.1);
  function archY(px){var t=(px-gx)/(W-2*gx);return ay-ah*Math.sin(Math.PI*t)}
  x.beginPath();for(var px=gx;px<=W-gx;px+=4)x.lineTo(px,archY(px));x.stroke();
  x.lineWidth=lw*.7;x.beginPath();for(var px2=gx;px2<=W-gx;px2+=4)x.lineTo(px2,archY(px2)+16*k);x.stroke();
  for(var s=1;s<14;s++){var sx=gx+(W-2*gx)*s/14;x.beginPath();x.moveTo(sx,archY(sx)+16*k);x.lineTo(sx,archY(sx));x.stroke()}
  var cx=W/2,cy=archY(cx)-4*k,cr=24*k;x.lineWidth=lw;x.save();x.shadowColor='transparent';x.fillStyle='rgba(20,14,4,.4)';x.beginPath();x.arc(cx,cy,cr,0,7);x.fill();x.restore();
  x.beginPath();x.arc(cx,cy,cr,0,7);x.stroke();scroll(x,cx-cr-14*k,cy+6*k,14*k,1);scroll(x,cx+cr+14*k,cy+6*k,14*k,-1);
  x.save();x.translate(cx,cy);circuitHeart(x,cr*.7,0,x.strokeStyle,lw*.8);x.restore();
  x.shadowColor='transparent';
  /* ivy, climbing roses and trailing blossom */
  var lc=tok('--stem'),lf=tok('--leaf');
  function climb(px,py,dense){ivy(x,px,py,(7+R()*5)*k,R()*6.3,shade(lf,(R()-.5)*.35));if(R()<dense)flower(x,R,R()<.75?'rose':'peony',px+(R()-.5)*8*k,py,(6+R()*7)*k,lc);
    if(R()<.35){x.save();x.translate(px+(R()-.5)*14*k,py+(R()-.5)*14*k);blossom(x,R,(2.5+R()*2)*k,pick(R,PAL.blossom));x.restore()}}
  for(var y=gt-30*k;y<H*.95;y+=11*k){var t=(y-gt)/(H-gt);climb(gx*.5+(R()-.5)*gx*1.1,y,.45-t*.2);climb(W-gx*.5+(R()-.5)*gx*1.1,y,.45-t*.2)}
  for(var a=gx;a<W*.36;a+=11*k)climb(a,archY(a)+8*k+(R()-.5)*12*k,.4);
  for(var b=W*.64;b<W-gx;b+=11*k)climb(b,archY(b)+8*k+(R()-.5)*12*k,.4);
  /* blossom cascades from the arch */
  for(var c=0;c<16;c++){var bx=gx+R()*(W-2*gx);if(Math.abs(bx-W/2)<W*.12)continue;var by=archY(bx)+10*k,len=(30+R()*80)*k;
    for(var d=0;d<len;d+=5*k){x.save();x.translate(bx+Math.sin(d*.08)*4*k,by+d);blossom(x,R,(2+R()*2.4)*k*(1-d/len*.4),pick(R,PAL.blossom));x.restore()}}
  x.fillStyle=tok('--wash');x.fillRect(0,0,W,H)}

/* ---------- whimsical bookcase dressing ---------- */
function decorate(){
  var el=document.querySelector('.shelves');if(!el)return;var old=el.querySelector('.dress');if(old)old.remove();
  var w=el.offsetWidth,h=el.offsetHeight,padX=70,padT=120,padB=30;var c=document.createElement('canvas');c.className='dress';c.setAttribute('aria-hidden','true');
  c.style.left=(-padX)+'px';c.style.top=(-padT)+'px';el.appendChild(c);
  var x=setup(c,w+padX*2,h+padT+padB),R=rng(42),k=Math.max(.7,Math.min(1.1,w/900));x.translate(padX,padT);
  /* carved crown */
  var ch=Math.min(82,w*.11)*k;var wg=x.createLinearGradient(0,-ch,0,10);wg.addColorStop(0,tok('--wood-hi'));wg.addColorStop(.6,tok('--wood'));wg.addColorStop(1,tok('--wood-lo'));
  x.fillStyle=wg;x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=10;x.shadowOffsetY=4;
  x.beginPath();x.moveTo(-8,14);x.lineTo(-8,-6);x.bezierCurveTo(w*.18,-6,w*.28,-ch*.55,w*.4,-ch*.62);
  x.bezierCurveTo(w*.44,-ch*1.05,w*.56,-ch*1.05,w*.6,-ch*.62);x.bezierCurveTo(w*.72,-ch*.55,w*.82,-6,w+8,-6);x.lineTo(w+8,14);x.closePath();x.fill();x.shadowColor='transparent';
  /* scalloped trim under the crown */
  x.fillStyle=tok('--wood-lo');for(var sx=0;sx<w;sx+=18){x.beginPath();x.arc(sx+9,14,9,0,Math.PI);x.fill()}
  /* gilt carving */
  ironStyle(x,w,2);x.shadowColor='transparent';x.lineWidth=2;
  x.beginPath();x.moveTo(8,-2);x.bezierCurveTo(w*.2,-2,w*.3,-ch*.45,w*.42,-ch*.5);x.stroke();
  x.beginPath();x.moveTo(w-8,-2);x.bezierCurveTo(w*.8,-2,w*.7,-ch*.45,w*.58,-ch*.5);x.stroke();
  for(var s2=0;s2<3;s2++){scroll(x,w*.3-s2*w*.09,-ch*.18+s2*4,8*k,1);scroll(x,w*.7+s2*w*.09,-ch*.18+s2*4,8*k,-1)}
  var mr=ch*.36;x.beginPath();x.arc(w/2,-ch*.52,mr,0,7);x.fillStyle='rgba(20,12,4,.45)';x.fill();x.lineWidth=2.2;x.stroke();
  x.save();x.translate(w/2,-ch*.52);circuitHeart(x,mr*.72,0,x.strokeStyle,1.6);x.restore();
  /* fairy lights */
  var lit=tok('--bulb');
  [[0,w*.5,22],[w*.5,w,22]].forEach(function(sg){var n=Math.round((sg[1]-sg[0])/26);for(var i=0;i<=n;i++){var t=i/n,px=sg[0]+(sg[1]-sg[0])*t,py=24+Math.sin(Math.PI*t)*sg[2];
      if(i<n){var t2=(i+1)/n;x.strokeStyle='rgba(60,45,25,.7)';x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(sg[0]+(sg[1]-sg[0])*t2,24+Math.sin(Math.PI*t2)*sg[2]);x.stroke()}
      var gl=x.createRadialGradient(px,py+4,0,px,py+4,12);gl.addColorStop(0,lit);gl.addColorStop(1,'rgba(255,220,140,0)');x.fillStyle=gl;x.beginPath();x.arc(px,py+4,12,0,7);x.fill();
      x.fillStyle='#fff6d6';x.beginPath();x.ellipse(px,py+4,2.2,3.2,0,0,7);x.fill()}});
  /* vines trailing down both sides and over the crown */
  var lc=tok('--stem'),lf=tok('--leaf');
  function vine(px,py,dir,len){for(var d=0;d<len;d+=9){var vx=px+Math.sin(d*.045+dir)*7;
      ivy(x,vx+(R()-.5)*8,py+d,(6+R()*4)*k,(R()-.5)*2.6+dir*.6,shade(lf,(R()-.5)*.35));
      if(R()<.16)flower(x,R,pick(R,['rose','rose','peony','ranunculus']),vx+(R()-.5)*10,py+d,(5+R()*4)*k,lc);
      else if(R()<.2){x.save();x.translate(vx+(R()-.5)*12,py+d);blossom(x,R,(2.4+R()*1.8)*k,pick(R,PAL.blossom));x.restore()}}}
  vine(-4,-10,-1,Math.min(h*.7,520));vine(w+4,-10,1,Math.min(h*.55,420));
  for(var cv=0;cv<w*.35;cv+=10){var cx=cv,cy=-8-Math.max(0,(cv-w*.15))*.25;ivy(x,cx+(R()-.5)*6,cy+(R()-.5)*6,(5+R()*4)*k,R()*6.3,shade(lf,(R()-.5)*.3));if(R()<.18)flower(x,R,'rose',cx,cy,(5+R()*3)*k,lc)}
  for(var cv2=w;cv2>w*.68;cv2-=10){var cy2=-8-Math.max(0,(w*.85-cv2))*.25;ivy(x,cv2+(R()-.5)*6,cy2+(R()-.5)*6,(5+R()*4)*k,R()*6.3,shade(lf,(R()-.5)*.3));if(R()<.18)flower(x,R,'peony',cv2,cy2,(5+R()*3)*k,lc)}
  x.fillStyle=tok('--wash');x.globalCompositeOperation='source-atop';x.fillRect(-padX,-padT,w+padX*2,h+padT+padB)}
window.__decorate=function(){try{decorate()}catch(e){}};

var lastW=0,lastH=0;
function draw(force){var W=window.innerWidth,H=window.innerHeight;if(!force&&W===lastW&&Math.abs(H-lastH)<140)return;lastW=W;lastH=H;
  var gx=Math.max(20,Math.round(W*.04)),gt=Math.round(Math.max(110,H*.2)),lw=(W-2*gx)/2,lh=H-gt,arch=Math.min(H*.12,lw*.35);
  try{drawGarden(W,H);
    [cL,cR].forEach(function(c){c.style.top=(gt-arch)+'px'});cL.style.left=gx+'px';cR.style.right=gx+'px';
    drawLeaf(cL,lw,lh+arch,arch,false);drawLeaf(cR,lw,lh+arch,arch,true);drawFrame(W,H,gx,gt)}catch(e){}}
draw(true);window.__decorate();
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){draw(false);window.__decorate()},180)});
function retheme(){draw(true);window.__decorate()}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',retheme)}catch(e){}
try{new MutationObserver(retheme).observe(doc,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
})();
</script>
</body></html>
